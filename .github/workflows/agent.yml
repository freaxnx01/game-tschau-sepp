name: Claude
on:
  issues:
    types: [labeled]
  # retry-dispatch.sh redispatches this workflow after a transient failure.
  # Without the trigger and the two inputs below the retry is refused and a
  # one-off provider hiccup becomes a permanent ai:failed (agent-workflow#351).
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue number to implement.
        required: true
      attempt:
        description: 1-based retry attempt counter.
        required: false
        default: '1'

permissions:
  contents: write
  pull-requests: write
  issues: write
  # github.token needs this to create the retry's workflow_dispatch event.
  actions: write

jobs:
  claude:
    # github.event.label is null under workflow_dispatch, so the guard has to
    # admit both events — but keep the label check, or every label added to any
    # issue would start a run.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-implement'
    uses: freaxnx01/agent-workflow/.github/workflows/agent-implement.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    with:
      # workflow_dispatch inputs are always strings and agent-implement.yml
      # types both of these as `number`, so the dispatched values need
      # fromJSON. The label event supplies a real number already — calling
      # fromJSON on it would be a type error, hence the guard rather than
      # `fromJSON(inputs.x || github.event...)`.
      issue-number: ${{ inputs.issue-number && fromJSON(inputs.issue-number) || github.event.issue.number }}
      attempt: ${{ inputs.attempt && fromJSON(inputs.attempt) || 1 }}
      # Keep the shared scripts on the same ref as the workflow pinned above:
      # pipeline-ref defaults to main, which drifts from @v1 and breaks the run.
      pipeline-ref: v2
      runner-labels: '["ubuntu-latest"]'
      default-model: z-ai/glm-5.2
      max-turns: 60
      pre-preview: true
      agent: opencode
