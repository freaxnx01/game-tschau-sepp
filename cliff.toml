# git-cliff configuration — Conventional Commits -> Keep a Changelog.
#
# IMPORTANT: CHANGELOG.md is hand-curated. Its entries are user-facing prose
# ("Covering an Ass now draws one card per click..."), not commit subjects, and
# they are worth more to a reader than what this config can generate.
#
# So do NOT run `git cliff --tag vX.Y.Z -o CHANGELOG.md` — that regenerates the
# whole file from commit subjects and destroys the curation. At v0.3.0 it would
# have replaced the curated entries with "Add favicon" and "Extract
# recycleDiscard as the single reshuffle site".
#
# Release flow: promote the curated `## [Unreleased]` heading to
# `## [X.Y.Z] - <date>` by hand and open a fresh empty `[Unreleased]`.
# See AGENT-NOTES.md, "Release flow".
#
# This config is kept for `git cliff --unreleased` as a READ-ONLY cross-check:
# it lists conventional commits since the last tag, so you can spot a change
# that never got a curated entry. Never redirect that output over CHANGELOG.md.
[changelog]
header = """
# Changelog

All notable changes to this project are documented here, following
[Keep a Changelog](https://keepachangelog.com) and
[Semantic Versioning](https://semver.org).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
]
tag_pattern = "v[0-9]*"
